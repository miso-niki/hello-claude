<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Hello, Claude Code!</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #000;
    color: #fff;
  }
  h1 {
    font-size: 5rem;
    margin: 0;
    background: linear-gradient(90deg, #ff004c, #ff8a00, #ffee00, #14ff00, #00d4ff, #6a00ff, #ff00c8);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  button {
    margin-top: 2rem;
    padding: 0.75rem 1.75rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 9999px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button:hover {
    background: rgba(255, 255, 255, 0.18);
  }
  button:active {
    transform: scale(0.97);
  }
  .buttons {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  footer {
    position: absolute;
    bottom: 1.5rem;
    font-size: 0.9rem;
    color: #aaa;
  }
</style>
</head>
<body>
  <h1>初コミット達成！</h1>
  <div class="buttons">
    <button type="button" id="toggleBtn">文字を切り替え</button>
    <button type="button" id="colorBtn">色を変える</button>
    <button type="button" id="countBtn">カウントアップ (0)</button>
  </div>
  <footer>2026 by Yoshiaki Nitta</footer>
  <script>
    const h1 = document.querySelector('h1');
    const originalText = h1.textContent;
    const toggledText = 'ボタンが押されました！';

    document.getElementById('toggleBtn').addEventListener('click', () => {
      h1.textContent = h1.textContent === originalText ? toggledText : originalText;
    });

    const colors = ['#ff004c', '#ff8a00', '#ffee00', '#14ff00', '#00d4ff', '#6a00ff', '#ff00c8'];
    let colorIndex = 0;
    document.getElementById('colorBtn').addEventListener('click', () => {
      colorIndex = (colorIndex + 1) % colors.length;
      const c = colors[colorIndex];
      h1.style.background = 'none';
      h1.style.webkitTextFillColor = c;
      h1.style.color = c;
      h1.style.animation = 'none';
    });

    const countBtn = document.getElementById('countBtn');
    let count = 0;
    countBtn.addEventListener('click', () => {
      count++;
      countBtn.textContent = `カウントアップ (${count})`;
    });
  </script>
</body>
</html>
